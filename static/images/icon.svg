<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <title>One Figure, Every Canvas</title>
  <desc>One flowchart laid out on a landscape, a square, and a portrait canvas.</desc>
  <style>.frame{stroke:#59318a}.wire{stroke:#a693cf}.n1{fill:#5a6fd0}.n2{fill:#8a5cc4}.n3{fill:#b9688f}</style>
  <g class="frame" fill="none" stroke-width="1.1" stroke-linejoin="round">
    <rect x="2" y="2" width="11" height="7" rx="1.5"/>
    <rect x="2" y="11" width="11" height="11" rx="1.5"/>
    <rect x="15" y="2" width="7" height="20" rx="1.5"/>
  </g>
  <g class="wire" fill="none" stroke-width="0.6">
    <path d="M5.5 5.5H6.5M8.5 5.5H9.5"/>
    <path d="M7.5 15V16.5M5 18V16.5H10V18"/>
    <path d="M18.5 6.5V11M18.5 13V17.5"/>
  </g>
  <g class="n1"><rect x="3.5" y="4.5" width="2" height="2" rx="0.5"/><rect x="6.5" y="4.5" width="2" height="2" rx="0.5"/><rect x="9.5" y="4.5" width="2" height="2" rx="0.5"/></g>
  <g class="n2"><rect x="6" y="13" width="3" height="2" rx="0.5"/><rect x="3.5" y="18" width="3" height="2" rx="0.5"/><rect x="8.5" y="18" width="3" height="2" rx="0.5"/></g>
  <g class="n3"><rect x="17" y="4.5" width="3" height="2" rx="0.5"/><rect x="17" y="11" width="3" height="2" rx="0.5"/><rect x="17" y="17.5" width="3" height="2" rx="0.5"/></g>
</svg>
